name = "saahil-portfolio-visits"
main = "worker.js"
compatibility_date = "2025-01-01"

# Created by:  wrangler d1 create portfolio-visits
# Paste the database_id it prints into the line below.
[[d1_databases]]
binding       = "DB"
database_name = "portfolio-visits"
database_id   = "8c3f49bf-3832-4677-85a6-d62b76027353"

# Stores the resume PDF you upload from the ?admin=1 panel. Created with:
#   wrangler kv namespace create RESUME_KV
[[kv_namespaces]]
binding = "RESUME_KV"
id      = "ef9f8d5793a748e09248b27f16a59bfb"

[vars]
# Any random string. Only used to salt the IP hash so unique-visitor counting
# works without ever storing an actual IP address.
IP_SALT = "c419b76478827c67be94ee96927cb988"
